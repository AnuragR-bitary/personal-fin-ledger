service: personal-fin-ledger-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DB_HOST: ${env:DB_HOST, 'localhost'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_USER: ${env:DB_USER, 'postgres'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'postgres'}
    DB_NAME: ${env:DB_NAME, 'personal-fin-ledger'}

plugins:
  - serverless-offline

functions:
  # ─── Owner ──────────────────────────────────────────────────────────────────
  me:
    handler: src/handlers/me.handler
    events:
      - http:
          path: me
          method: get
          cors: true

  # ─── Friends ────────────────────────────────────────────────────────────────
  createFriend:
    handler: src/handlers/create-friend.handler
    events:
      - http:
          path: friends
          method: post
          cors: true

  listFriends:
    handler: src/handlers/list-friends.handler
    events:
      - http:
          path: friends
          method: get
          cors: true
      - http:
          path: friends/{id}
          method: get
          cors: true

  updateFriend:
    handler: src/handlers/update-friend.handler
    events:
      - http:
          path: friends/{id}
          method: put
          cors: true

  deleteFriend:
    handler: src/handlers/delete-friend.handler
    events:
      - http:
          path: friends/{id}
          method: delete
          cors: true

  # ─── Expenses ───────────────────────────────────────────────────────────────
  expenses:
    handler: src/handlers/expense.handler
    events:
      - http:
          path: expenses
          method: get
          cors: true
      - http:
          path: expenses
          method: post
          cors: true

  deleteExpense:
    handler: src/handlers/delete-expense.handler
    events:
      - http:
          path: expenses/{id}
          method: delete
          cors: true

  # ─── Payments ───────────────────────────────────────────────────────────────
  payments:
    handler: src/handlers/record-repayment.handler
    events:
      - http:
          path: payments
          method: get
          cors: true
      - http:
          path: payments
          method: post
          cors: true

  # ─── Balances ───────────────────────────────────────────────────────────────
  balances:
    handler: src/handlers/balances.handler
    events:
      - http:
          path: balances
          method: get
          cors: true
